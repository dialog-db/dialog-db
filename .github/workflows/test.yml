on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # Run CI for brannches with this prefix so that radicle integration
      # can pick those CI jobs and report them in patches (equivalent of pull
      # requests)
      - patches/*

name: 'Test'

concurrency:
  # Each commit on main gets its own group, so every merge runs to the end
  # and keeps its artifacts. Other refs cancel a run a newer push replaces.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. `actions: read` lets the gates download the base
# commit's sweep from its run; the one job that writes (the delta report
# comment) asks for that itself.
permissions:
  contents: read
  actions: read

jobs:
  lint_nix:
    name: 'Lint Nix'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          send-statistics: false
          ignore-missing-flake-lock: false

  lint_rust:
    name: 'Lint Rust'
    needs: ['lint_nix']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: cisagov/action-disable-apparmor@v1
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10; v11 and main put TMPDIR under /nix/tmp, which breaks the Nix installer
        with:
          root-safe-haven: '16384'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-ops
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only main writes the cache: an upload must not fail a PR's
          # checks, and an unmerged branch must not write what main reads.
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: 'Run lints'
        shell: bash
        run: |
          nix develop --accept-flake-config --command lint

  # The engine's cost matrix (rust/dialog-perf): every scenario under
  # callgrind, its instruction count and exact step counts gated against
  # the baselines under perf/baseline. A regression here is a change in
  # what the engine does for a workload, caught before it lands.
  #
  # On a pull request the sweep is also gated against the one CI recorded
  # for the main commit the pull request lands on
  # (scripts/ci/base-sweep.sh), so a regression the baseline files leave
  # room for still fails, and every row against that base goes to the
  # delta report below. The files stay a gate too: they catch drift
  # across pull requests that each pass against their own base.
  perf:
    name: 'Perf gate'
    needs: ['lint_nix']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: cisagov/action-disable-apparmor@v1
      # Two commits deep: on a pull request the checkout is the merge
      # commit, and its first parent is the base the sweep is compared
      # against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10; v11 and main put TMPDIR under /nix/tmp, which breaks the Nix installer
        with:
          root-safe-haven: '16384'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-ops
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only main writes the cache: an upload must not fail a PR's
          # checks, and an unmerged branch must not write what main reads.
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      # CARGO_HOME must live on the /nix volume, not under $HOME.
      # nothing-but-nix keeps purging the runner in the background
      # after its step returns, and at its default hatchet protocol
      # (cleave) the last thing it deletes is $HOME/.cargo, cargo's
      # default home. The matrix jobs never notice: they build through
      # `nix build`, which vendors crates in the store. This job runs
      # cargo directly and reaches the registry about a minute in, so
      # the two raced: cargo extracted crates into ~/.cargo/registry
      # while rmz was deleting them (#638).
      - name: 'Run the sweep'
        shell: bash
        run: |
          sudo mkdir -p /nix/cargo
          sudo chown "$(id -u):$(id -g)" /nix/cargo
          nix develop \
            --accept-flake-config \
            --set-env-var CARGO_HOME /nix/cargo \
            --command perf:sweep
      # After the sweep, so a main commit merged just before this run
      # started has usually finished its own gate by now. A failure here
      # leaves the gate to the baseline files; the report says so.
      - name: 'Fetch the base sweep'
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          scripts/ci/base-sweep.sh perf-current 'Perf gate' perf/baseline target/perf-base target/perf-delta
      - name: 'Run the perf gate'
        shell: bash
        run: |
          nix develop \
            --accept-flake-config \
            --set-env-var CARGO_HOME /nix/cargo \
            --command perf:check
      - name: 'Upload the sweep'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'perf-current'
          path: 'target/perf-current'
      - name: 'Upload the delta'
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 'perf-delta'
          path: 'target/perf-delta'
          if-no-files-found: ignore

  # What a replica pays to join (rust/dialog-soak): the join scenario
  # over the unshaped `none` network profile, whose request counts are
  # deterministic protocol shape, gated against soak/baseline. The
  # shaped profiles (broadband, mobile, ...) stay on the nightly sweep
  # (nightly-soak.yml); see issue #642 for the gate this is the first
  # step of. On a pull request it is also compared against the base
  # commit's sweep, as the Perf gate is. Both sweeps run under the same
  # fixed seed, so their counts are exact (see soak:check in flake.nix).
  soak_sync:
    name: 'Replication gate'
    needs: ['lint_nix']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: cisagov/action-disable-apparmor@v1
      # Two commits deep, for the base: see the Perf gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10; v11 and main put TMPDIR under /nix/tmp, which breaks the Nix installer
        with:
          root-safe-haven: '16384'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-ops
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only main writes the cache: an upload must not fail a PR's
          # checks, and an unmerged branch must not write what main reads.
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      # CARGO_HOME must live on the /nix volume, not under $HOME, for the
      # reason the Perf gate above gives: this job runs cargo directly,
      # and nothing-but-nix's background purge deletes $HOME/.cargo
      # while cargo may be extracting into it (#638).
      - name: 'Run the sweep'
        shell: bash
        run: |
          sudo mkdir -p /nix/cargo
          sudo chown "$(id -u):$(id -g)" /nix/cargo
          nix develop \
            --accept-flake-config \
            --set-env-var CARGO_HOME /nix/cargo \
            --command soak:sweep
      - name: 'Fetch the base sweep'
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          scripts/ci/base-sweep.sh soak-current 'Replication gate' soak/baseline target/soak-base target/soak-delta
      - name: 'Run the replication gate'
        shell: bash
        run: |
          nix develop \
            --accept-flake-config \
            --set-env-var CARGO_HOME /nix/cargo \
            --command soak:check
      - name: 'Upload the sweep'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'soak-current'
          path: 'target/soak-current'
      - name: 'Upload the delta'
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 'soak-delta'
          path: 'target/soak-delta'
          if-no-files-found: ignore

  # One comment per pull request with both gates' rows against the base,
  # edited in place on every push (found by the marker in its body). It
  # builds nothing: it reads the delta artifacts the gates uploaded, and
  # runs when they fail too, since that is when the table matters most.
  #
  # The only job that writes. It runs on `pull_request`, never
  # `pull_request_target`, so a fork's code never runs with this token;
  # and on a fork's pull request GitHub grants a read-only token anyway,
  # so there the report goes to the job summary instead.
  delta_report:
    name: 'Delta report'
    needs: ['perf', 'soak_sync']
    if: always() && github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: 'perf-delta'
          path: 'delta/perf'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: 'soak-delta'
          path: 'delta/soak'
      - name: 'Post the report'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          PR: '${{ github.event.pull_request.number }}'
          FORK: '${{ github.event.pull_request.head.repo.full_name != github.repository }}'
        run: |
          if [ "$FORK" = true ]; then
            scripts/ci/delta-report.sh delta/perf delta/soak delta/body.md
          else
            scripts/ci/delta-report.sh delta/perf delta/soak delta/body.md "$PR"
          fi

  lints:
    name: 'Lints'
    needs: ['lint_nix', 'lint_rust']
    runs-on: 'ubuntu-latest'
    steps:
      - run: echo "Lints are good!"

  # Beside the Rust lints, not after them. The lints take a quarter of an
  # hour, and a run that waits for them before it starts a test cannot
  # finish in less than that plus the slowest configuration. A commit that
  # fails a lint now spends runner time on tests whose result is not
  # needed; that is the price of hearing about both sooner.
  tests:
    name: 'Tests'
    needs: ['lint_nix']
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        configuration:
          - 'test:native:debug'
          - 'test:native:release'
          - 'test:web:debug'
          - 'test:web:release'
          - 'test:cross:integration'
    steps:
      # NOTE: AppArmor became more restrictive in Ubuntu 24.04 and
      # causes problems for Puppeteer when launching Chrome; it should
      # be safe to disable it.
      # SEE: https://github.com/NixOS/nixpkgs/issues/121694#issuecomment-2159420924
      # SEE: https://github.com/actions/runner-images/issues/10015
      - uses: cisagov/action-disable-apparmor@v1
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10; v11 and main put TMPDIR under /nix/tmp, which breaks the Nix installer
        with:
          root-safe-haven: '16384'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-ops
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only main writes the cache: an upload must not fail a PR's
          # checks, and an unmerged branch must not write what main reads.
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      # TMPDIR, cargo's home and its target directory live on the large
      # /nix volume, not the root filesystem. nothing-but-nix leaves the
      # root filesystem only root-safe-haven (16GB) of free space, which
      # the build and test artifacts (test binaries, the shared wasm
      # cache, browser profiles) can outgrow; the /nix volume has ~90GB of
      # headroom. nothing-but-nix also keeps purging the runner in the
      # background, and the last thing it deletes is $HOME/.cargo, cargo's
      # default home (#638).
      - name: 'Make room for the build'
        shell: bash
        run: |
          sudo mkdir -p /nix/tmp /nix/cargo
          sudo chmod 1777 /nix/tmp
          sudo chown "$(id -u):$(id -g)" /nix/cargo
      # The configurations build with cargo in the dev shell, and what
      # cargo built of the dependencies is kept from run to run: about
      # 1,000 crates, several minutes of every build, and as many
      # downloads from crates.io, which rate-limits CI runners. The
      # workspace's own crates are the larger part of a build and are
      # rebuilt on every run; see the prune step below.
      #
      # The key names the exact dependency set and toolchain. main
      # restores only that, so what it saves holds nothing stale. Any
      # other ref also takes the newest cache of its configuration: a
      # pull request that changes Cargo.lock rebuilds the crates that
      # changed, not all of them.
      - name: 'Restore the dependencies'
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            /nix/cargo/home/registry/index
            /nix/cargo/home/registry/cache
            /nix/cargo/home/git/db
            /nix/cargo/target
          key: cargo-v1-${{ matrix.configuration }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('cargo-v1-{0}-', matrix.configuration) || '' }}
      # The profiles here differ from a developer's build in what costs
      # time and changes no test's result:
      #
      # - No incremental state: nothing reuses it, since a checkout gives
      #   every source file a new modification time.
      # - No debug info in debug builds. Every test binary links the whole
      #   dependency graph, and with debug info the target directory of
      #   one debug configuration is over 27GB against 2.7GB without. A
      #   panic still names its file and line.
      # - Release builds without link-time optimization, in 16 codegen
      #   units. The release profile (thin LTO, one unit) optimizes the
      #   whole graph again for each of the 65 test binaries. What the
      #   release configurations are for, the tests under opt-level 3
      #   with debug assertions and overflow checks off, is unchanged.
      - name: 'Run test configuration'
        shell: bash
        run: |
          nix develop \
            --accept-flake-config \
            --set-env-var TMPDIR /nix/tmp \
            --set-env-var CARGO_HOME /nix/cargo/home \
            --set-env-var CARGO_TARGET_DIR /nix/cargo/target \
            --set-env-var CARGO_INCREMENTAL 0 \
            --set-env-var CARGO_PROFILE_DEV_DEBUG 0 \
            --set-env-var CARGO_PROFILE_RELEASE_LTO off \
            --set-env-var CARGO_PROFILE_RELEASE_CODEGEN_UNITS 16 \
            --command ${{ matrix.configuration }}
      # Saved only when this exact key was not there to restore, so a
      # dependency set is saved once: by main when a merge changes it, or
      # by the pull request that changes it, whose later pushes then find
      # it. The workspace's own artifacts are cut out first.
      - name: 'Prune what the next run cannot use'
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: |
          scripts/ci/prune-cargo-target.sh /nix/cargo/target
      - name: 'Save the dependencies'
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /nix/cargo/home/registry/index
            /nix/cargo/home/registry/cache
            /nix/cargo/home/git/db
            /nix/cargo/target
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
