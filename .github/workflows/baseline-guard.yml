on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: 'Baseline guard'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The perf and replication gates pass a pull request that gets slower
  # if the same pull request re-records, removes or loosens what they
  # compare against. Accepting a cost is a maintainer's call, so a change
  # to the baselines, the comparison or the gates' workflow fails here
  # until the pull request carries the `perf-cost-accepted` label.
  guard:
    name: 'Baseline guard'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Check for unaccepted changes to the gates'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-cost-accepted') }}
        run: |
          guarded=$(git diff --name-only "$BASE" HEAD -- \
            'perf/baseline/' \
            'soak/baseline/' \
            'rust/dialog-perf/src/compare.rs' \
            'rust/dialog-soak/src/compare.rs' \
            '.github/workflows/test.yml' \
            '.github/workflows/baseline-guard.yml')
          if [ -z "$guarded" ]; then
            echo "No baseline, comparison or gate workflow changes."
            exit 0
          fi
          echo "This pull request changes what the perf and replication gates hold it to:"
          echo "$guarded" | sed 's/^/  /'
          if [ "$ACCEPTED" = "true" ]; then
            echo "Accepted: the pull request carries the perf-cost-accepted label."
            exit 0
          fi
          echo "::error::Changes to the gates need a maintainer's perf-cost-accepted label."
          exit 1
