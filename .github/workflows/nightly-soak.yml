name: 'Nightly Soak'

# The standing convergence soak: the same tests CI runs at bounded scale,
# nightly at the heavy knobs — many-seed adversarial manifests, the
# artifacts-level fuzz, and a deep SE-log convergence replay. Every arm
# runs the canonical-form validator at its checkpoints, so a red night
# localizes to a level and node (see rust/dialog-search-tree/src/
# validate.rs); an ignored minimizer test in tests/adversarial.rs shrinks
# a caught divergence to its exact op prefix.
#
# The sync arm is a cost soak, not a convergence one: it replays the
# join scenario over simulated network profiles (rust/dialog-soak) and
# fails when round trips, bytes, or modeled join time regress past the
# checked-in baseline under soak/baseline.

on:
  workflow_dispatch:
    inputs:
      adversarial_seeds:
        description: 'Adversarial soak seed count'
        required: false
        default: '200'
      fuzz_seeds:
        description: 'Artifact fuzz seed count'
        required: false
        default: '200'
      rehearse:
        description: >-
          Rehearse the report: name an arm to fail it; every arm skips its
          soak and the report prints what it would do instead of doing it
        required: false
        default: ''
  schedule:
    # 03:17 UTC nightly — off the busy on-the-hour spike.
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  soak:
    name: '${{ matrix.name }}'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        # Each arm is a dev-shell menu command (see the `soak:*` entries in
        # flake.nix) carrying its own heavy-knob defaults; the matrix only
        # wires the workflow_dispatch overrides through as env vars.
        include:
          - name: 'adversarial manifests'
            command: 'soak:adversarial'
            env_name: 'DIALOG_ADVERSARIAL_SEEDS'
            env_value_input: 'adversarial_seeds'
          - name: 'program surfaces'
            command: 'soak:program'
            env_name: ''
            env_value_input: ''
          - name: 'artifact fuzz'
            command: 'soak:artifacts'
            env_name: 'DIALOG_ARTIFACT_FUZZ_SEEDS'
            env_value_input: 'fuzz_seeds'
          - name: 'SE convergence deep'
            command: 'soak:converge'
            env_name: ''
            env_value_input: ''
          - name: 'sync cost over simulated networks'
            command: 'soak:sync'
            env_name: ''
            env_value_input: ''
    steps:
      - uses: cisagov/action-disable-apparmor@v1
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: '16384'
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        with:
          name: tonk-ops
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # Knobs exported here are inherited by the menu command inside
      # `nix develop`; without an override the command's own defaults apply.
      #
      # CARGO_HOME must live on the /nix volume, not under $HOME: the
      # arms run cargo directly, and nothing-but-nix's background purge
      # deletes $HOME/.cargo while cargo may be extracting into it. See
      # the Perf gate in test.yml and #638.
      - name: 'Run soak arm'
        shell: bash
        env:
          ARM: '${{ matrix.name }}'
          REHEARSE: '${{ github.event.inputs.rehearse }}'
        run: |
          # A rehearsal skips the soak and fails only the arm it names, to
          # exercise the report job below without hours of soak.
          if [ -n "$REHEARSE" ]; then
            echo "soak arm: $ARM (rehearsal)"
            if [ "$REHEARSE" = "$ARM" ]; then
              echo "thread 'rehearsal' panicked: forced failure of the $ARM arm"
              exit 1
            fi
            exit 0
          fi
          override="${{ github.event.inputs[matrix.env_value_input] }}"
          if [ -n "${{ matrix.env_name }}" ] && [ -n "$override" ]; then
            export ${{ matrix.env_name }}="$override"
            echo "soak arm: ${{ matrix.name }} (${{ matrix.env_name }}=$override)"
          else
            echo "soak arm: ${{ matrix.name }} (default knobs)"
          fi
          sudo mkdir -p /nix/cargo
          sudo chown "$(id -u):$(id -g)" /nix/cargo
          nix develop \
            --accept-flake-config \
            --set-env-var CARGO_HOME /nix/cargo \
            --command ${{ matrix.command }}

  # A red arm on main opens an issue titled by the arm, or comments on the
  # one already open, with the run link and the first error lines; a green
  # arm closes its open issue. The arms ran red for three weeks unnoticed
  # before this (#652). Only a scheduled run, or a dispatch on main that is
  # not a rehearsal, writes to issues; any other run prints what it would
  # write.
  report:
    name: 'Report'
    needs: ['soak']
    if: always()
    runs-on: 'ubuntu-latest'
    permissions:
      actions: read
      issues: write
    steps:
      - name: 'Open, update or close an issue per arm'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          DRY_RUN: "${{ github.ref != 'refs/heads/main' || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || github.event.inputs.rehearse != '' }}"
        run: |
          set -euo pipefail
          echo "dry run: $DRY_RUN"

          # Runs `gh` with the given arguments, or prints them (and the
          # body file among them) on a dry run.
          write() {
            if [ "$DRY_RUN" = "true" ]; then
              echo "would run: gh $*"
              for arg in "$@"; do
                if [ -f "$arg" ]; then sed 's/^/    /' "$arg"; fi
              done
            else
              gh "$@"
            fi
          }

          # The first error lines of a failed arm: its job log from the
          # first panic or error line after the arm's `soak arm:` banner,
          # 40 lines of it, or the log's last 40 lines when none matches.
          first_errors() {
            gh api "repos/$GH_REPO/actions/jobs/$1/logs" \
              | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*[A-Za-z]//g' \
              > log.txt || true
            banner=$(grep -n -m1 '^soak arm: ' log.txt | cut -d: -f1 || true)
            start=$(awk -v from="${banner:-1}" \
              'NR >= from && /panicked|^error|error\[|error:|FAILED|^Error/ { print NR; exit }' log.txt)
            if [ -n "$start" ]; then
              sed -n "${start},$((start + 39))p" log.txt
            else
              tail -n 40 log.txt
            fi
          }

          gh issue list --state open --limit 1000 --json number,title > open.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name != "Report") | [.id, .conclusion, .name] | @tsv' \
            > arms.tsv

          while IFS=$'\t' read -r job conclusion arm; do
            title="Nightly soak: $arm is failing"
            issue=$(jq -r --arg title "$title" \
              'map(select(.title == $title)) | first | .number // empty' open.json)
            echo "arm '$arm': $conclusion; open issue: ${issue:-none}"
            case "$conclusion" in
              failure)
                {
                  echo "The nightly soak arm \"$arm\" failed on main at $GITHUB_SHA."
                  echo
                  echo "Run: $RUN_URL"
                  echo
                  echo "First error lines:"
                  echo
                  echo '```'
                  first_errors "$job"
                  echo '```'
                } > body.md
                if [ -n "$issue" ]; then
                  write issue comment "$issue" --body-file body.md
                else
                  write issue create --title "$title" --body-file body.md
                fi
                ;;
              success)
                if [ -n "$issue" ]; then
                  echo "The nightly soak arm \"$arm\" passed on main at $GITHUB_SHA: $RUN_URL" > body.md
                  write issue comment "$issue" --body-file body.md
                  write issue close "$issue"
                fi
                ;;
            esac
          done < arms.tsv
