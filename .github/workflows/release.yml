on:
  push:
    tags:
      - 'v*'

name: 'Release'

permissions:
  contents: write

jobs:
  release:
    name: 'Release'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'The tag names the version the commit declares'
        run: scripts/release.sh check "$GITHUB_REF_NAME"
      - name: 'Publish the changelog section as the release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release.sh notes "$GITHUB_REF_NAME" > notes.md
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
