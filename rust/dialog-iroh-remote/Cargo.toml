[package]
name = "dialog-iroh-remote"
description = "Peer-to-peer remote for dialog-db: effects over iroh QUIC streams."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
integration-tests = ["dialog-common/integration-tests"]
web-integration-tests = ["dialog-common/web-integration-tests"]

[dependencies]
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-effects = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
ipld-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ipld_dagcbor = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
dialog-credentials = { workspace = true }

# The async tests run on tokio natively; in wasm `dialog_common::test`
# expands to wasm-bindgen-test instead. Target-gated because tokio's
# runtime pulls dependencies that do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(feature, values(\"web-integration-tests\"))",
  "cfg(dialog_test_wasm_integration)",
] }
