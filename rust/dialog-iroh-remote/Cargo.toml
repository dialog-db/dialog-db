[package]
name = "dialog-iroh-remote"
description = "Peer-to-peer remote for dialog-db: effects over iroh QUIC streams."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
helpers = []
# The iroh-backed `Channel` and its accept loop. Off by default and
# native-only: the trait is the crate's contract and needs no transport,
# so a wasm build -- and `dialog-network`, which composes this site --
# never pulls quinn in.
transport = ["dep:iroh", "dep:tokio", "dep:tracing"]
integration-tests = ["dialog-common/integration-tests"]
web-integration-tests = ["dialog-common/web-integration-tests"]

[dependencies]
async-trait = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-effects = { workspace = true }
dialog-ucan = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-did-web = { workspace = true }
dialog-varsig = { workspace = true }
ipld-core = { workspace = true }
iroh-base = { version = "1.2", features = ["key"] }
serde = { workspace = true, features = ["derive"] }
serde_ipld_dagcbor = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = { version = "1.2", optional = true }
tokio = { workspace = true, features = ["rt", "macros"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
async-trait = { workspace = true }
dialog-credentials = { workspace = true }
dialog-operator = { workspace = true, features = ["helpers"] }
dialog-storage = { workspace = true }

# The async tests run on tokio natively; in wasm `dialog_common::test`
# expands to wasm-bindgen-test instead. Target-gated because tokio's
# runtime pulls dependencies that do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(feature, values(\"web-integration-tests\", \"helpers\", \"transport\"))",
  "cfg(dialog_test_wasm_integration)",
] }
