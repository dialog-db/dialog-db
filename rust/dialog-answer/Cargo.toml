[package]
name = "dialog-answer"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "A query's answer as a binary columnar frame, read in place on the other side of a wire"

[features]
default = []
# Enable integration tests (tests with service provisioning)
integration-tests = ["dialog-common/integration-tests"]
# Enable web integration tests
web-integration-tests = ["dialog-common/web-integration-tests"]

# No dependencies: the reader is what a page or a guest takes to read an
# answer, so it must cost nothing to depend on.
[dependencies]

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(dialog_test_wasm_integration)",
    "cfg(feature, values(\"web-integration-tests\", \"integration-tests\"))",
] }
