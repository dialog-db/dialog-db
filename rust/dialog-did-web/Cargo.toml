[package]
name = "dialog-did-web"
description = "did:web resolution as an algorithm-agnostic Resolve capability"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["ed25519"]
ed25519 = ["dialog-credentials/ed25519"]
es256 = ["dialog-credentials/es256"]
# Exposes `MapFetch`, an in-memory `Fetch` for tests and downstream mocking.
test-fetch = []

[dependencies]
async-trait = { workspace = true }
base58 = { workspace = true }
base64 = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-credentials = { workspace = true }
dialog-varsig = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
dialog-credentials = { workspace = true, features = ["es256"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
wasm-bindgen-test = { workspace = true }
dialog-ucan-core = { workspace = true }

[lints.rust]
# These cfgs are used by the dialog_common::test proc macro.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(dialog_test_wasm_integration)",
    "cfg(feature, values(\"web-integration-tests\"))",
] }
