[package]
name = "dialog-baseline"
description = "Reference benchmarks comparing dialog-db against SQLite on identical workloads"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
publish = false

# This crate is native-only (bundled SQLite, filesystem-backed stores,
# multi-threaded tokio); the library compiles to nothing on wasm32 (see the
# crate-level cfg in src/lib.rs), and every native-only dependency is
# target-gated so the workspace's wasm dependency set is unaffected.

[dependencies]
anyhow = { workspace = true }
base58 = { workspace = true }
dialog-corpus = { workspace = true }
dialog-storage = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# The repository-layer write harness (`repo` module): real applications
# write through `Branch::commit`, so the scoreboard measures that surface
# too. Native-only, like everything else in this crate.
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-effects = { workspace = true }
dialog-network = { workspace = true }
dialog-peer = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true }
dialog-search-tree = { workspace = true, features = ["audit"] }
dialog-storage = { workspace = true, features = ["helpers"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The single-file archive, measured against the `fs` archive
# (`examples/file_archive_bench.rs`).
dialog-archive-file = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
# The single-file census (`examples/single_file_census.rs`) serializes tree
# values to measure them and models compressed and delta-encoded stores.
blake3 = { workspace = true }
rkyv = { workspace = true }
zstd = "0.13"
# The tonk benchmarks (`examples/tonk_dataset.rs`, `examples/tonk_bench.rs`)
# read a space's rules and concepts and keep their dataset as JSON lines.
dialog-credentials = { workspace = true }
dialog-query = { workspace = true }
dialog-remote-fs = { workspace = true }
dialog-varsig = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The search tree's volatile test archive, for the examples that build
# trees outside a repository.
dialog-search-tree = { workspace = true, features = ["audit", "helpers"] }

[[bench]]
name = "sqlite_vs_dialog"
harness = false

[[bench]]
name = "se_replay"
harness = false

[lints.rust]
# `tonk_bench` builds in a worktree of main with `--cfg dialog_main`,
# leaving out the stores main does not have.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dialog_main)"] }
