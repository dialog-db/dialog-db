[package]
name = "dialog-archive-file"
description = "A dialog archive kept in one append-only file"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Native-only: one file through positioned reads and writes. The library
# compiles to nothing on wasm32 (see the crate-level cfg in src/lib.rs), and
# every dependency is target-gated so the workspace's wasm dependency set is
# unaffected.

[features]
# Transcoding a block store (a directory of blocks, or an `fs` space's
# archive) into the file, and the `dialog-transcode` binary that does it.
transcode = ["dep:base58"]

[[bin]]
name = "dialog-transcode"
path = "src/bin/transcode.rs"
required-features = ["transcode"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base58 = { workspace = true, optional = true }
async-trait = { workspace = true }
crc32fast = { workspace = true }
dialog-artifacts = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-effects = { workspace = true }
dialog-search-tree = { workspace = true }
dialog-storage = { workspace = true }
hashbrown = { workspace = true }
memmap2 = { workspace = true }
parking_lot = { workspace = true }
rkyv = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = { workspace = true }
# The crate itself, with transcoding, so its tests run whatever features
# the test run picks.
dialog-archive-file = { workspace = true, features = ["transcode"] }
dialog-peer = { workspace = true, features = ["helpers"] }
dialog-repository = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints.rust]
# This cfg is used by the dialog_common::test proc macro for wasm inner tests
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dialog_test_wasm_integration)"] }
