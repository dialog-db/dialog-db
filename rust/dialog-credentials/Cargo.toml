[package]
name = "dialog-credentials"
description = "Concrete key and signing types for dialog-capability"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# ed25519 is the always-on default. Other algorithms are opt-in.
default = ["ed25519"]
ed25519 = [
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:base58",
    "dialog-varsig/edwards25519",
    "dialog-varsig/sha2_512",
]
es256 = [
    "dep:p256",
    "dep:getrandom",
    "dep:base58",
    "dialog-varsig/secp256r1",
    "dialog-varsig/sha2_256",
]
# WebAuthn / passkeys wrap ES256 (P-256), so this builds on the es256 stack and
# adds the JSON / base64 / hashing needed to parse and verify assertions.
webauthn = [
    "es256",
    "dep:sha2",
    "dep:base64",
    "dep:serde_json",
    "dialog-varsig/webauthn",
]
# RSA (PKCS#1 v1.5, SHA-256). Native-only: browser WebCrypto RSA is out of scope.
# `multibase` (not `base58`) decodes the did:key body: the RSA public key is
# variable length and the `base58` 0.2 decoder has a fixed 132-byte buffer that
# an RSA modulus overflows.
rsa = [
    "dep:rsa",
    "dep:multibase",
    "dialog-varsig/rsa",
]

[dependencies]
async-trait = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-varsig = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
signature = { workspace = true }

# ed25519 feature deps
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base58 = { workspace = true, optional = true }

# es256 (p256) feature deps
# `pkcs8` is used by the browser WebCrypto arm to encode the private scalar as
# PKCS#8 for `SubtleCrypto.importKey`; it is inert on native builds.
p256 = { workspace = true, optional = true, features = ["ecdsa", "pkcs8"] }

# webauthn feature deps: parse clientDataJSON, base64url the challenge, hash.
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# rsa feature deps (native RSA PKCS#1 v1.5 signing/verification)
rsa = { workspace = true, optional = true }
multibase = { workspace = true, optional = true }


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Crypto", "SubtleCrypto", "CryptoKey", "CryptoKeyPair"] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
ed25519-dalek = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.rust]
# These cfgs are used by the dialog_common::test proc macro
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(dialog_test_wasm_integration)",
    "cfg(feature, values(\"web-integration-tests\"))",
] }
