[package]
name = "dialog-credentials"
description = "Concrete key and signing types for dialog-capability"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# ed25519 is the always-on default. Other algorithms are opt-in.
default = ["ed25519"]
ed25519 = [
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:aes-gcm",
    "dep:hkdf",
    "dep:sha2",
    "dep:getrandom",
    "dep:base58",
    "dialog-varsig/edwards25519",
    "dialog-varsig/sha2_512",
]
es256 = [
    "dep:p256",
    "dep:getrandom",
    "dep:base58",
    "dialog-varsig/secp256r1",
    "dialog-varsig/sha2_256",
]

[dependencies]
async-trait = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-varsig = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
signature = { workspace = true }

# ed25519 feature deps
# `x25519-dalek` backs the X25519 agreement keys derived from an Ed25519 seed;
# on the browser arm the derivation still runs here, and only the resulting
# secret is handed to WebCrypto (which cannot derive X25519 from Ed25519).
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
# Sealed-secret deps. AES-GCM and HKDF run in Rust on native; the browser arm
# routes both through WebCrypto so they hit the platform's accelerated,
# constant-time implementations instead of a software AES compiled to wasm.
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base58 = { workspace = true, optional = true }

# es256 (p256) feature deps
# `pkcs8` is used by the browser WebCrypto arm to encode the private scalar as
# PKCS#8 for `SubtleCrypto.importKey`; it is inert on native builds.
p256 = { workspace = true, optional = true, features = ["ecdsa", "pkcs8"] }


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Crypto", "SubtleCrypto", "CryptoKey", "CryptoKeyPair"] }

[dev-dependencies]
dialog-common = { workspace = true, features = ["helpers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints.rust]
# These cfgs are used by the dialog_common::test proc macro
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(dialog_test_wasm_integration)",
    "cfg(feature, values(\"web-integration-tests\"))",
] }
