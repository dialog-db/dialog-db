[package]
name = "dialog-remote-ucan"
description = "UCAN remote: one request proves and performs each operation at an access service"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
helpers = [
    "dep:anyhow",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dialog-common/helpers",
    "dialog-remote-ucan-s3/helpers",
]
integration-tests = ["helpers", "dialog-common/integration-tests"]
web-integration-tests = ["helpers", "dialog-common/web-integration-tests"]

[dependencies]
async-trait = { workspace = true }
base58 = { workspace = true }
dialog-capability = { workspace = true }
dialog-common = { workspace = true }
dialog-did-web = { workspace = true }
dialog-effects = { workspace = true }
dialog-remote-s3 = { workspace = true }
dialog-remote-ucan-s3 = { workspace = true }
dialog-ucan-core = { workspace = true }
dialog-varsig = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Optional dependencies (helpers feature, cross-platform)
anyhow = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Streaming response bodies. Native only: on wasm the feature pulls in
# `wasm-streams`, which collides with the copy the `worker` crate links
# downstream (see the note on the workspace `reqwest`).
reqwest = { workspace = true, features = ["stream"] }
# Optional dependencies (helpers feature, native-only server infrastructure)
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
# The socket client: reading and writing a connection run as tasks.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The socket client in a browser or worker: the platform's WebSocket.
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
# The wasm half of a cross-target test is a `wasm_bindgen_test`, whose
# expansion names `wasm_bindgen` itself.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dialog-common = { workspace = true, features = ["helpers"] }
dialog-credentials = { workspace = true }
dialog-ucan = { workspace = true }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(feature, values(\"web-integration-tests\", \"integration-tests\", \"helpers\"))",
  "cfg(dialog_test_wasm_integration)"
] }
