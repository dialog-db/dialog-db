on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

name: 'CI'

jobs:
  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all --all-targets --all-features -- -D warnings

  test:
    name: 'Test'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: 'Unit tests'
        run: cargo test
      - name: 'Build wbg-pool'
        run: cargo build --release
      - name: 'Install cargo-nextest'
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/bin
      - name: 'Fixture tests (cargo nextest, per-test processes)'
        working-directory: fixtures/isolation-fixture
        env:
          # ubuntu-latest ships Google Chrome.
          CHROME: google-chrome
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/target/release/wbg-pool
        run: cargo nextest run --target wasm32-unknown-unknown
      - name: 'Fixture tests (cargo test, whole-binary invocations)'
        working-directory: fixtures/isolation-fixture
        env:
          CHROME: google-chrome
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/target/release/wbg-pool
        run: cargo test --target wasm32-unknown-unknown
      - name: 'Failure propagation'
        working-directory: fixtures/isolation-fixture
        env:
          CHROME: google-chrome
        run: |
          BINARY=$(ls target/wasm32-unknown-unknown/debug/deps/isolation_fixture-*.wasm | head -n 1)
          if "${{ github.workspace }}/target/release/wbg-pool" "$BINARY" deliberately_fails --exact --include-ignored; then
            echo "expected a failing exit code" >&2
            exit 1
          fi
      - name: 'Stop daemon'
        if: always()
        run: "${{ github.workspace }}/target/release/wbg-pool daemon --stop"
