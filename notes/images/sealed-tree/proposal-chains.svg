<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="Epochs over time for three levels. L3 and L2 epochs are linked backward by back wraps. L1 epochs are not. Down rows link each level's current epoch to the level below. Removing a member rotates all three levels; removing a replicator rotates only L1 and adds a down row from the current L2 epoch.">
<style>
svg{--bg:#fbfbf9;--ink:#1c2125;--muted:#5b656d;--rule:#c9cec7;--code:#eceee9;--pub:#9a5f0e;--pubs:#f5e6cf;--l1:#1f5f78;--l1s:#d8e8ee;--l2:#62489a;--l2s:#e6e0f2;--l3:#1d6e48;--l3s:#d9ecdf}
@media (prefers-color-scheme: dark){svg{--bg:#171b1f;--ink:#e1e5e8;--muted:#9aa4ac;--rule:#3a424a;--code:#1d2227;--pub:#e1a64f;--pubs:#3a2d18;--l1:#6bb7d3;--l1s:#17313b;--l2:#b6a0e3;--l2s:#2a2340;--l3:#69cf9b;--l3s:#173326}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.s-line{stroke:var(--ink);fill:none;stroke-width:1.2}
.s-thin{stroke:var(--rule);fill:none;stroke-width:1.2}
.s-dash{stroke:var(--ink);fill:none;stroke-width:1.2;stroke-dasharray:4 3}
.s-pub-line{stroke:var(--pub);fill:none;stroke-width:2.2}
.s-l1-line{stroke:var(--l1);fill:none;stroke-width:1.6}
.s-l3-line{stroke:var(--l3);fill:none;stroke-width:2}
.f-pub{fill:var(--pubs);stroke:var(--pub);stroke-width:1.2}
.f-l1{fill:var(--l1s);stroke:var(--l1);stroke-width:1.2}
.f-l2{fill:var(--l2s);stroke:var(--l2);stroke-width:1.2}
.f-l3{fill:var(--l3s);stroke:var(--l3);stroke-width:1.2}
.f-plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.f-muted{fill:var(--code);stroke:var(--rule);stroke-width:1.2}
.f-ink{fill:var(--ink)}.f-pubink{fill:var(--pub)}.f-l1ink{fill:var(--l1)}.f-l3ink{fill:var(--l3)}
.t{fill:var(--ink);font-size:12.5px}
.t-sm{fill:var(--ink);font-size:11px}
.t-mute{fill:var(--muted);font-size:11px}
.t-b{fill:var(--ink);font-size:12.5px;font-weight:600}
.t-mono{fill:var(--ink);font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-pub{fill:var(--pub);font-size:12px;font-weight:600}
.t-l1{fill:var(--l1);font-size:12px;font-weight:600}
.t-l2{fill:var(--l2);font-size:12px;font-weight:600}
.t-l3{fill:var(--l3);font-size:12px;font-weight:600}
</style>
<rect class="bg" x="0" y="0" width="720" height="270" rx="4"/>
<defs>
      <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker>
    </defs>
    <text class="t-l3" x="20" y="47">L3</text>
    <text class="t-l2" x="20" y="117">L2</text>
    <text class="t-l1" x="20" y="187">L1</text>
    <!-- L3 epochs -->
    <rect class="f-l3" x="80" y="28" width="90" height="30"/><text class="t-sm" x="125" y="47" text-anchor="middle">e3·1</text>
    <rect class="f-l3" x="330" y="28" width="90" height="30"/><text class="t-sm" x="375" y="47" text-anchor="middle">e3·2</text>
    <!-- L2 epochs -->
    <rect class="f-l2" x="80" y="98" width="90" height="30"/><text class="t-sm" x="125" y="117" text-anchor="middle">e2·1</text>
    <rect class="f-l2" x="330" y="98" width="90" height="30"/><text class="t-sm" x="375" y="117" text-anchor="middle">e2·2</text>
    <!-- L1 epochs -->
    <rect class="f-l1" x="80" y="168" width="90" height="30"/><text class="t-sm" x="125" y="187" text-anchor="middle">e1·1</text>
    <rect class="f-l1" x="330" y="168" width="90" height="30"/><text class="t-sm" x="375" y="187" text-anchor="middle">e1·2</text>
    <rect class="f-l1" x="560" y="168" width="90" height="30"/><text class="t-sm" x="605" y="187" text-anchor="middle">e1·3</text>
    <!-- back wraps -->
    <line class="s-dash" x1="330" y1="43" x2="172" y2="43" marker-end="url(#arr-c)"/>
    <text class="t-mute" x="251" y="37" text-anchor="middle">back</text>
    <line class="s-dash" x1="330" y1="113" x2="172" y2="113" marker-end="url(#arr-c)"/>
    <text class="t-mute" x="251" y="107" text-anchor="middle">back</text>
    <text class="t-mute" x="251" y="210" text-anchor="middle">not chained</text>
    <text class="t-mute" x="490" y="210" text-anchor="middle">not chained</text>
    <!-- down rows -->
    <line class="s-line" x1="125" y1="58" x2="125" y2="96" marker-end="url(#arr-c)"/>
    <line class="s-line" x1="125" y1="128" x2="125" y2="166" marker-end="url(#arr-c)"/>
    <line class="s-line" x1="375" y1="58" x2="375" y2="96" marker-end="url(#arr-c)"/>
    <line class="s-line" x1="375" y1="128" x2="375" y2="166" marker-end="url(#arr-c)"/>
    <line class="s-line" x1="420" y1="120" x2="565" y2="166" marker-end="url(#arr-c)"/>
    <text class="t-mute" x="136" y="82">down</text>
    <text class="t-mute" x="508" y="140">down</text>
    <!-- events -->
    <line class="s-thin" x1="300" y1="20" x2="300" y2="230"/>
    <line class="s-thin" x1="535" y1="20" x2="535" y2="230"/>
    <text class="t-sm" x="300" y="250" text-anchor="middle">member removed:</text>
    <text class="t-sm" x="300" y="264" text-anchor="middle">all three rotate</text>
    <text class="t-sm" x="535" y="250" text-anchor="middle">replicator removed:</text>
    <text class="t-sm" x="535" y="264" text-anchor="middle">L1 rotates</text>
</svg>
