<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="The key space in order: tags 0 to 5 are sealed indexes, 6 to FE are reserved, and FF, the keyring, is the public right edge.">
<style>
svg{--bg:#fbfbf9;--ink:#1c2125;--muted:#5b656d;--rule:#c9cec7;--code:#eceee9;--pub:#9a5f0e;--pubs:#f5e6cf;--l1:#1f5f78;--l1s:#d8e8ee;--l2:#62489a;--l2s:#e6e0f2;--l3:#1d6e48;--l3s:#d9ecdf}
@media (prefers-color-scheme: dark){svg{--bg:#171b1f;--ink:#e1e5e8;--muted:#9aa4ac;--rule:#3a424a;--code:#1d2227;--pub:#e1a64f;--pubs:#3a2d18;--l1:#6bb7d3;--l1s:#17313b;--l2:#b6a0e3;--l2s:#2a2340;--l3:#69cf9b;--l3s:#173326}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.s-line{stroke:var(--ink);fill:none;stroke-width:1.2}
.s-thin{stroke:var(--rule);fill:none;stroke-width:1.2}
.s-dash{stroke:var(--ink);fill:none;stroke-width:1.2;stroke-dasharray:4 3}
.s-pub-line{stroke:var(--pub);fill:none;stroke-width:2.2}
.s-l1-line{stroke:var(--l1);fill:none;stroke-width:1.6}
.s-l3-line{stroke:var(--l3);fill:none;stroke-width:2}
.f-pub{fill:var(--pubs);stroke:var(--pub);stroke-width:1.2}
.f-l1{fill:var(--l1s);stroke:var(--l1);stroke-width:1.2}
.f-l2{fill:var(--l2s);stroke:var(--l2);stroke-width:1.2}
.f-l3{fill:var(--l3s);stroke:var(--l3);stroke-width:1.2}
.f-plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.f-muted{fill:var(--code);stroke:var(--rule);stroke-width:1.2}
.f-ink{fill:var(--ink)}.f-pubink{fill:var(--pub)}.f-l1ink{fill:var(--l1)}.f-l3ink{fill:var(--l3)}
.t{fill:var(--ink);font-size:12.5px}
.t-sm{fill:var(--ink);font-size:11px}
.t-mute{fill:var(--muted);font-size:11px}
.t-b{fill:var(--ink);font-size:12.5px;font-weight:600}
.t-mono{fill:var(--ink);font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-pub{fill:var(--pub);font-size:12px;font-weight:600}
.t-l1{fill:var(--l1);font-size:12px;font-weight:600}
.t-l2{fill:var(--l2);font-size:12px;font-weight:600}
.t-l3{fill:var(--l3);font-size:12px;font-weight:600}
</style>
<rect class="bg" x="0" y="0" width="720" height="150" rx="4"/>
<text class="t-mute" x="20" y="22">key order →</text>
    <rect class="f-l3" x="20" y="44" width="66" height="36"/>
    <rect class="f-l3" x="90" y="44" width="66" height="36"/>
    <rect class="f-l3" x="160" y="44" width="66" height="36"/>
    <rect class="f-l3" x="230" y="44" width="66" height="36"/>
    <rect class="f-l3" x="300" y="44" width="66" height="36"/>
    <rect class="f-l3" x="370" y="44" width="66" height="36"/>
    <rect class="f-muted" x="440" y="44" width="170" height="36" stroke-dasharray="4 3"/>
    <rect class="f-pub" x="614" y="44" width="86" height="36"/>
    <text class="t-mono" x="53" y="67" text-anchor="middle">00</text>
    <text class="t-mono" x="123" y="67" text-anchor="middle">01</text>
    <text class="t-mono" x="193" y="67" text-anchor="middle">02</text>
    <text class="t-mono" x="263" y="67" text-anchor="middle">03</text>
    <text class="t-mono" x="333" y="67" text-anchor="middle">04</text>
    <text class="t-mono" x="403" y="67" text-anchor="middle">05</text>
    <text class="t-mono" x="525" y="67" text-anchor="middle">06 … FE</text>
    <text class="t-mono" x="657" y="67" text-anchor="middle">FF</text>
    <text class="t-sm" x="53" y="98" text-anchor="middle">entity</text>
    <text class="t-sm" x="123" y="98" text-anchor="middle">attribute</text>
    <text class="t-sm" x="193" y="98" text-anchor="middle">value</text>
    <text class="t-sm" x="263" y="98" text-anchor="middle">history</text>
    <text class="t-sm" x="333" y="98" text-anchor="middle">blob</text>
    <text class="t-sm" x="403" y="98" text-anchor="middle">coverage</text>
    <text class="t-mute" x="525" y="98" text-anchor="middle">free for sealed indexes</text>
    <text class="t-sm" x="657" y="98" text-anchor="middle">keyring</text>
    <line class="s-line" x1="20" y1="118" x2="608" y2="118"/>
    <line class="s-line" x1="20" y1="113" x2="20" y2="123"/>
    <line class="s-line" x1="608" y1="113" x2="608" y2="123"/>
    <text class="t-l3" x="314" y="138" text-anchor="middle">sealed</text>
    <line class="s-pub-line" x1="614" y1="118" x2="700" y2="118"/>
    <text class="t-pub" x="657" y="138" text-anchor="middle">public</text>
</svg>
